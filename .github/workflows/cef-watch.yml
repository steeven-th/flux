name: CEF watch

# Chromium security fixes reach Flux through new CEF versions. Once a day, this compares the version
# pinned in scripts/cef.env with the latest stable one on the CEF build server. When a newer one is
# out, it opens an issue, or updates the open one, and starts the CEF build for it. Each version is
# handled once, so a failed build is not started again every day.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  # Starts the CEF build.
  actions: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compare with the latest stable CEF
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source scripts/cef.env
          latest="$(curl --fail --silent --show-error --location https://cef-builds.spotifycdn.com/index.json \
            | jq -r '[.macosarm64.versions[] | select(.channel == "stable")][0].cef_version')"
          if [[ -z "$latest" || "$latest" == null ]]; then
            echo "::error::No stable macosarm64 version in the CEF build server's index"
            exit 1
          fi
          echo "Pinned: $CEF_VERSION"
          echo "Latest stable: $latest"
          newest="$(printf '%s\n' "$CEF_VERSION" "$latest" | sort -V | tail -n 1)"
          if [[ "$latest" == "$CEF_VERSION" || "$newest" != "$latest" ]]; then
            exit 0
          fi

          title="CEF ${latest%%+*} is available"
          gh label create cef-update --color 0E8A16 --description "A newer CEF version is out" --force
          read -r number current < <(gh issue list --label cef-update --state open --limit 1 \
            --json number,title -q '.[] | "\(.number) \(.title)"') || true
          if [[ "${current:-}" == "$title" ]]; then
            echo "Already handled in #$number"
            exit 0
          fi

          body="$(cat <<EOF
          Flux is on CEF \`$CEF_VERSION\`. The latest stable build is \`$latest\`, with Chromium ${latest##*chromium-}.

          A [CEF build]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/cef-build.yml) of it has started and takes most of a day. When its pre-release is published:

          1. \`scripts/bump-cef.sh $latest\`
          2. \`scripts/build.sh --run\`, then check that video plays, for example on Twitch.
          3. Commit \`scripts/cef.env\` and close this issue.

          If the build fails, [docs/cef.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/main/docs/cef.md) explains how to resume it.
          EOF
          )"
          if [[ -n "${number:-}" ]]; then
            gh issue edit "$number" --title "$title" --body "$body"
          else
            gh issue create --title "$title" --label cef-update --body "$body"
          fi
          gh workflow run cef-build.yml -f cef_version="$latest"
