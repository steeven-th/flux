name: Flux

options:
  bundleIdPrefix: com.flux-browser
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.11.0

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ARCHS: arm64
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    FRAMEWORK_SEARCH_PATHS: $(PROJECT_DIR)/vendor/enginecore

targets:
  Flux:
    type: application
    platform: macOS
    sources:
      - Sources/Flux
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flux-browser.Flux
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_VERSION: "6.0"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Flux/Flux-Bridging-Header.h
        CLANG_ENABLE_OBJC_ARC: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: build/plists/Flux.plist
      properties:
        CFBundleName: Flux
        CFBundleDisplayName: Flux
        CFBundleShortVersionString: "0.1.0" # x-release-please-version
        CFBundleVersion: "1"
        NSHumanReadableCopyright: Copyright © 2026 The Flux Authors.
        NSPrincipalClass: NSApplication
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSSupportsAutomaticGraphicsSwitching: true
        # Without them macOS refuses these devices to Flux without asking. Translated in
        # InfoPlist.xcstrings.
        NSCameraUsageDescription: Websites you allow can use your camera.
        NSMicrophoneUsageDescription: Websites you allow can use your microphone.
        NSLocationUsageDescription: Websites you allow can see your location.
        NSBluetoothAlwaysUsageDescription: Websites you allow can connect to Bluetooth devices.
        # Makes Flux one of the browsers macOS offers as default, and lets it open HTML files.
        CFBundleURLTypes:
          - CFBundleURLName: Web site URL
            CFBundleURLSchemes: [http, https]
        CFBundleDocumentTypes:
          - CFBundleTypeName: HTML document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.html, public.xhtml]
        # Lets SwiftUI and AppKit drag and drop agree on the sidebar's own items.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.flux-browser.sidebar-item
            UTTypeDescription: Flux sidebar item
            UTTypeConformsTo: [public.data]
    dependencies:
      - package: GRDB
      - framework: vendor/enginecore/EngineCore.framework
        embed: true
